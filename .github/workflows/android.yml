name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create dummy google-services.json
      run: |
        echo '{
          "project_info": { "project_number": "123456789", "project_id": "dummy-id" },
          "client": [
            {
              "client_info": { "mobilesdk_app_id": "1:123:android:123", "android_client_info": { "package_name": "com.android.knewsapp" } },
              "api_key": [ { "current_key": "dummy_key" } ],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }
          ],
          "configuration_version": "1"
        }' > app/google-services.json

    - name: Run Static Analysis (KtLint)
      run: ./gradlew ktlintCheck

    - name: Run Static Analysis (Detekt)
      run: ./gradlew detekt

    - name: Run Unit Tests
      run: ./gradlew test

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: knews-app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
